<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
 width="1180" height="610" viewBox="0 0 1180 610" role="img">
<defs>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#0891b2"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="portraitClip">
    <rect x="52" y="150" width="430" height="390" rx="18"/>
  </clipPath>
  <style>
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .sans { font-family: system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    .label { font-size: 12px; fill: #475569; font-weight: 600; letter-spacing: .04em; }
    .value { font-size: 15px; fill: #0f172a; font-weight: 500; }
    .small { font-size: 12px; fill: #475569; }
    .section { font-size: 13px; fill: #0891b2; font-weight: 700; letter-spacing: .08em; }
  </style>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#0891b2" opacity=".13"/>
  </pattern>
</defs>

<rect width="1180" height="610" rx="24" fill="#f8fafc"/>
<rect x="18" y="18" width="1144" height="574" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="30" y="30" width="1120" height="52" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
<circle cx="56" cy="56" r="6" fill="#fb7185"/>
<circle cx="78" cy="56" r="6" fill="#fbbf24"/>
<circle cx="100" cy="56" r="6" fill="#059669"/>
<text x="590" y="61" text-anchor="middle" class="mono" font-size="14" font-weight="600" fill="#475569">profile.sh --live</text>
<text x="1118" y="61" text-anchor="end" class="mono" font-size="12" fill="#059669">● LIVE</text>

<rect x="42" y="102" width="460" height="466" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="62" y="130" class="mono section">VISUAL.MAP</text>
<rect x="62" y="146" width="420" height="400" rx="14" fill="url(#dots)"/>

<!-- Actual uploaded photo. Keep profile-photo.png beside this SVG in the repository. -->
<image x="62" y="146" width="420" height="400" preserveAspectRatio="xMidYMid slice"
       clip-path="url(#portraitClip)" xlink:href="profile-photo.png"
       href="profile-photo.png">
  <animate attributeName="opacity" values="0.94;1;0.94" dur="4s" repeatCount="indefinite"/>
</image>

<rect x="62" y="146" width="420" height="400" rx="14" fill="none" stroke="url(#accent)" opacity=".65"/>
<text x="62" y="560" class="mono small">PHOTO.MAP // 720 × 720 // LIVE</text>

<rect x="520" y="102" width="618" height="466" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="548" y="132" class="mono section">SYSTEM.INFO</text>
<line x1="548" y1="148" x2="1110" y2="148" stroke="#cbd5e1"/>

<text x="548" y="180" class="mono label">NAME</text>
<text x="690" y="180" class="sans value">Naman Karna</text>
<text x="548" y="211" class="mono label">GITHUB</text>
<text x="690" y="211" class="sans value">@namankarna0</text>
<text x="548" y="242" class="mono label">ROLE</text>
<text x="690" y="242" class="sans value">Currently Exploring</text>
<text x="548" y="273" class="mono label">LOCATION</text>
<text x="690" y="273" class="sans value">Biratnagar, Nepal</text>
<text x="548" y="304" class="mono label">EDUCATION</text>
<text x="690" y="304" class="sans value" font-size="14">Computer Engineering • IOE Purwanchal</text>
<text x="548" y="335" class="mono label">OS</text>
<text x="690" y="335" class="sans value">Arch Linux</text>
<text x="548" y="366" class="mono label">STATUS</text>
<text x="690" y="366" class="sans value" fill="#059669">Building + Learning</text>

<line x1="548" y1="390" x2="1110" y2="390" stroke="#cbd5e1"/>
<text x="548" y="418" class="mono section">TOOLCHAIN</text>
<text x="548" y="445" class="sans value" font-size="14">VS Code • Git • Android Studio • Canva • Figma</text>
<text x="548" y="476" class="mono section">STACK</text>
<text x="548" y="503" class="sans value" font-size="14">C • C++ • Python • JavaScript • TypeScript</text>
<text x="548" y="530" class="sans value" font-size="14">HTML • CSS • React • Node.js • Django • MongoDB</text>
</svg>